name: Daily Regulatory Scraper

on:
  schedule:
    # 03:00 UTC = 08:30 AM IST (Monday to Friday)
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Daily Scraper
        run: python scrape.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No new signals found today."
          else
            git commit -m "Auto-refresh regulatory signals [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
