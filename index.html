<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHANAKYA INTELLIGENCE TERMINAL</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #111827;
      --border: #1f2937;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --amber: #f59e0b;
      --emerald: #10b981;
      --cyan: #06b6d4;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: var(--bg-dark); color: var(--text-main); font-size: 13px; line-height: 1.5; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .terminal-title { font-weight: 800; font-size: 18px; letter-spacing: 0.05em; color: #fff; }
    .terminal-tag { background: #374151; color: #fbbf24; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 8px; }
    .status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--emerald); }
    .status-dot { width: 8px; height: 8px; background: var(--emerald); border-radius: 50%; box-shadow: 0 0 8px var(--emerald); }
    .layout { display: grid; grid-template-columns: 320px 1fr 340px; gap: 16px; }
    @media (max-width: 1200px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px; overflow: hidden; }
    .panel-header { font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--amber); letter-spacing: 0.08em; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .search-box { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 8px 10px; border-radius: 4px; margin-bottom: 12px; font-size: 12px; }
    .search-box:focus { outline: 1px solid var(--amber); }
    .list-container { max-height: calc(100vh - 200px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .item-card { background: #162032; border: 1px solid var(--border); border-radius: 4px; padding: 10px; cursor: pointer; transition: 0.15s; }
    .item-card:hover { border-color: var(--amber); background: #1a273f; }
    .item-card.active { border-left: 3px solid var(--amber); background: #1f2d47; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; margin-bottom: 4px; }
    .badge-stage1 { background: #1e3a8a; color: #93c5fd; }
    .badge-stage2 { background: #4c1d95; color: #d8b4fe; }
    .badge-stage4 { background: #065f46; color: #6ee7b7; }
    .badge-cyan { background: #164e63; color: #67e8f9; }
    .badge-amber { background: #78350f; color: #fde68a; }
    .ticker-tag { background: #000; border: 1px solid #374151; color: #38bdf8; padding: 1px 5px; border-radius: 3px; font-size: 11px; margin-right: 4px; font-family: monospace; }
    .feed-item { border-bottom: 1px solid #1f2937; padding: 10px 0; }
    .feed-item:last-child { border-bottom: none; }
    .feed-title { font-weight: 600; color: #f3f4f6; margin-bottom: 4px; }
    .feed-meta { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }
    .impact-box { background: #0a0f1d; border-left: 2px solid var(--cyan); padding: 6px 8px; margin-top: 6px; font-size: 11px; color: #cbd5e1; }
    a.source-link { color: var(--blue); text-decoration: none; font-size: 11px; }
    a.source-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <span class="terminal-title">CHANAKYA INTELLIGENCE TERMINAL</span>
      <span class="terminal-tag">UNION EXECUTIVE & REGULATORY ARBITRAGE</span>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="syncStatus">LIVE FEED ACTIVE</span>
    </div>
  </div>

  <div class="layout">
    <!-- PANEL 1: EXECUTIVE ROSTER -->
    <div class="panel">
      <div class="panel-header">Union Executive Watchlist</div>
      <input type="text" id="ministerSearch" class="search-box" placeholder="Filter minister or sector...">
      <div class="list-container" id="ministerList"></div>
    </div>

    <!-- PANEL 2: REGULATORY ARBITRAGE SIGNALS (LIVE FEED) -->
    <div class="panel">
      <div class="panel-header">Regulatory News Wire & Stage Arbitrage</div>
      <div class="list-container" id="signalFeed"></div>
    </div>

    <!-- PANEL 3: DOSSIER & TICKER MATRIX -->
    <div class="panel">
      <div class="panel-header">Dossier / Sensitivity Profile</div>
      <div id="dossierView" style="color: var(--text-muted);">
        Select a minister from the left to view sector jurisdiction, regulatory moats, and stock sensitivity.
      </div>
    </div>
  </div>

  <script>
    let MINISTERS = [];
    let SIGNALS = [];

    async function loadData() {
      try {
        const res = await fetch('./data.json?t=' + Date.now(), {
          cache: 'no-store'
        });
        if (res.ok) {
          const json = await res.json();
          MINISTERS = json.ministers || [];
          SIGNALS = json.signals || [];
          document.getElementById('syncStatus').innerText = `DATA SYNCED (${SIGNALS.length} SIGNALS)`;
        }
      } catch (e) {
        console.warn("Could not fetch remote data.json, using defaults:", e);
      }
      renderMinisters(MINISTERS);
      renderSignals(SIGNALS);
    }

    function renderMinisters(list) {
      const container = document.getElementById('ministerList');
      container.innerHTML = list.map((m, idx) => `
        <div class="item-card" onclick="selectMinister(${idx})">
          <div style="font-weight: 700; color: #fff;">${m.name}</div>
          <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px;">${m.portfolio}</div>
          <div>
            ${m.tickers.map(t => `<span class="ticker-tag">${t}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderSignals(list) {
      const container = document.getElementById('signalFeed');
      if (list.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); padding: 10px;">No regulatory signals recorded yet. Scraper runs weekday mornings.</div>';
        return;
      }
      container.innerHTML = list.map(s => `
        <div class="feed-item">
          <div>
            <span class="badge ${s.badge}">${s.stage}</span>
            <span class="badge badge-amber">${s.category}</span>
          </div>
          <div class="feed-title">${s.title}</div>
          <div class="impact-box">${s.impact}</div>
          <div class="feed-meta" style="margin-top: 6px;">
            <span>Executive: <strong>${s.minister}</strong></span>
            <span>${s.date} ${s.url && s.url !== '#' ? `· <a class="source-link" href="${s.url}" target="_blank">Source</a>` : ''}</span>
          </div>
        </div>
      `).join('');
    }

    function selectMinister(idx) {
      const m = MINISTERS[idx];
      const view = document.getElementById('dossierView');
      view.innerHTML = `
        <div style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 4px;">${m.name}</div>
        <div style="font-size: 12px; color: var(--amber); margin-bottom: 12px;">${m.portfolio}</div>
        
        <div style="font-weight: 700; margin-bottom: 6px; color: #fff;">Mapped Equities:</div>
        <div style="margin-bottom: 14px;">
          ${m.tickers.map(t => `<span class="ticker-tag" style="font-size: 12px; padding: 2px 6px;">${t}</span>`).join('')}
        </div>

        <div style="font-weight: 700; margin-bottom: 6px; color: #fff;">Key Regulatory Levers:</div>
        <ul style="padding-left: 18px; font-size: 12px; color: #cbd5e1; line-height: 1.6;">
          <li>Public Procurement & Concessions</li>
          <li>Quality Control Orders (QCO) via BIS</li>
          <li>Production Linked Incentive (PLI) approvals</li>
          <li>Import Licensing & Non-Tariff Barriers</li>
        </ul>
      `;
    }

    document.getElementById('ministerSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = MINISTERS.filter(m => 
        m.name.toLowerCase().includes(q) || 
        m.portfolio.toLowerCase().includes(q) || 
        m.tickers.some(t => t.toLowerCase().includes(q))
      );
      renderMinisters(filtered);
    });

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
